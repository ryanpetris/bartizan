appId: app.bartizan.desktop
productName: Bartizan
directories:
  output: release
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - '!out/**/*.map'
  - package.json
npmRebuild: false
linux:
  files:
    - '!node_modules/node-pty/prebuilds/**'
  target: [AppImage, tar.gz]
  category: Network;RemoteAccess
  executableName: bartizan
  icon: assets/icon.png
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  extraFiles:
    - LICENSE
    - from: build/VERSION
      to: VERSION
    - from: packaging/AppRun
      to: AppRun
    - from: packaging/bartizan.desktop
      to: bartizan.desktop
    - from: assets/icon.png
      to: bartizan.png
appImage:
  executableArgs: []
  artifactName: ${productName}-${version}.${ext}
mac:
  files:
    - '!node_modules/node-pty/prebuilds/{linux,win32}-*/**'
    - '!node_modules/node-pty/prebuilds/darwin-!(${arch})/**'
  target: [dmg]
  category: public.app-category.developer-tools
  icon: assets/icon.png
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  identity: '-'
  hardenedRuntime: false
  notarize: false
  extraResources: [LICENSE]
